<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Panel - Manage students, marks, and notices">
    <title>Admin Panel | Result Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">LOADING ADMIN</div>
    </div>

    <!-- Particle Background -->
    <div class="particles-bg" id="particlesBg"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <span class="nav-brand-icon">🎓</span>
            <span class="nav-brand-text">RESULT DASHBOARD</span>
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="admin.html" class="active">Admin Panel</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">

        <div class="section-header fade-in">
            <h1 class="section-title">⚙️ Admin Panel</h1>
            <p class="section-subtitle">Manage students, marks, and announcements</p>
        </div>

        <!-- Admin Tabs -->
        <div class="admin-tabs fade-in">
            <button class="admin-tab active" data-tab="students" onclick="switchTab('students')">👥 Students</button>
            <button class="admin-tab" data-tab="marks" onclick="switchTab('marks')">📝 Marks</button>
            <button class="admin-tab" data-tab="notices" onclick="switchTab('notices')">📢 Notices</button>
        </div>

        <!-- ==================== STUDENTS TAB ==================== -->
        <div class="tab-content active" id="tab-students">
            <div class="admin-grid">

                <!-- Add / Edit Student Form -->
                <div class="admin-form-card fade-in">
                    <h3 id="studentFormTitle">➕ ADD NEW STUDENT</h3>
                    <form id="studentForm" onsubmit="handleStudentSubmit(event)">
                        <input type="hidden" id="studentId">
                        <div class="form-group">
                            <label>Student Name</label>
                            <input type="text" id="studentName" placeholder="Enter full name" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Roll Number</label>
                                <input type="text" id="studentRoll" placeholder="e.g. BCA2024001" required>
                            </div>
                            <div class="form-group">
                                <label>Course</label>
                                <select id="studentCourse" required>
                                    <option value="">Select Course</option>
                                    <option value="BCA">BCA</option>
                                    <option value="MCA">MCA</option>
                                    <option value="B.Sc IT">B.Sc IT</option>
                                    <option value="B.Tech">B.Tech</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Semester</label>
                                <select id="studentSemester" required>
                                    <option value="">Select Semester</option>
                                    <option value="1">Semester 1</option>
                                    <option value="2">Semester 2</option>
                                    <option value="3">Semester 3</option>
                                    <option value="4">Semester 4</option>
                                    <option value="5">Semester 5</option>
                                    <option value="6">Semester 6</option>
                                    <option value="7">Semester 7</option>
                                    <option value="8">Semester 8</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="studentEmail" placeholder="email@example.com">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Phone</label>
                                <input type="text" id="studentPhone" placeholder="Phone number">
                            </div>
                            <div class="form-group">
                                <label>Profile Picture URL</label>
                                <input type="text" id="studentPicture" placeholder="Image URL (optional)">
                            </div>
                        </div>
                        <div style="display:flex;gap:10px;margin-top:0.5rem;">
                            <button type="submit" class="btn btn-primary">💾 Save Student</button>
                            <button type="button" class="btn btn-outline" onclick="resetStudentForm()">↩ Reset</button>
                        </div>
                    </form>
                </div>

                <!-- Students List -->
                <div class="admin-form-card fade-in">
                    <h3>📋 ALL STUDENTS</h3>
                    <div class="admin-students-list" id="adminStudentsList">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== MARKS TAB ==================== -->
        <div class="tab-content" id="tab-marks">
            <div class="admin-grid">

                <!-- Add / Edit Mark Form -->
                <div class="admin-form-card fade-in">
                    <h3 id="markFormTitle">➕ ADD MARKS</h3>
                    <form id="markForm" onsubmit="handleMarkSubmit(event)">
                        <input type="hidden" id="markId">
                        <div class="form-group">
                            <label>Select Student</label>
                            <select id="markStudentId" required>
                                <option value="">Choose student...</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Subject</label>
                                <input type="text" id="markSubject" placeholder="Subject name" required>
                            </div>
                            <div class="form-group">
                                <label>Semester</label>
                                <select id="markSemester" required>
                                    <option value="">Select</option>
                                    <option value="1">Sem 1</option>
                                    <option value="2">Sem 2</option>
                                    <option value="3">Sem 3</option>
                                    <option value="4">Sem 4</option>
                                    <option value="5">Sem 5</option>
                                    <option value="6">Sem 6</option>
                                    <option value="7">Sem 7</option>
                                    <option value="8">Sem 8</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Marks Obtained</label>
                                <input type="number" id="markMarks" placeholder="e.g. 85" min="0" required>
                            </div>
                            <div class="form-group">
                                <label>Maximum Marks</label>
                                <input type="number" id="markMaxMarks" placeholder="e.g. 100" min="1" required>
                            </div>
                        </div>
                        <div style="display:flex;gap:10px;margin-top:0.5rem;">
                            <button type="submit" class="btn btn-primary">💾 Save Marks</button>
                            <button type="button" class="btn btn-outline" onclick="resetMarkForm()">↩ Reset</button>
                        </div>
                    </form>
                </div>

                <!-- Marks List -->
                <div class="admin-form-card fade-in">
                    <h3>📋 RECENT MARKS</h3>
                    <div class="form-group">
                        <label>Filter by Student</label>
                        <select id="marksFilterStudent" onchange="loadMarksByStudent()">
                            <option value="">All Students</option>
                        </select>
                    </div>
                    <div class="admin-students-list" id="adminMarksList">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== NOTICES TAB ==================== -->
        <div class="tab-content" id="tab-notices">
            <div class="admin-grid">

                <!-- Add Notice Form -->
                <div class="admin-form-card fade-in">
                    <h3 id="noticeFormTitle">➕ ADD NOTICE</h3>
                    <form id="noticeForm" onsubmit="handleNoticeSubmit(event)">
                        <input type="hidden" id="noticeId">
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" id="noticeTitle" placeholder="Notice title" required>
                        </div>
                        <div class="form-group">
                            <label>Content</label>
                            <textarea id="noticeContent" rows="4" placeholder="Notice content..." required style="resize:vertical;"></textarea>
                        </div>
                        <div style="display:flex;gap:10px;margin-top:0.5rem;">
                            <button type="submit" class="btn btn-primary">💾 Save Notice</button>
                            <button type="button" class="btn btn-outline" onclick="resetNoticeForm()">↩ Reset</button>
                        </div>
                    </form>
                </div>

                <!-- Notices List -->
                <div class="admin-form-card fade-in">
                    <h3>📋 ALL NOTICES</h3>
                    <div class="admin-notices-list" id="adminNoticesList">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="js/admin.js"></script>
</body>
</html>
